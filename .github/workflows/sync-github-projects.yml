name: Sync GitHub projects

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-github-projects
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      GITHUB_USERNAME: ItsAkshatSh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync project data and artwork
        run: node scripts/sync-github-projects.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects.json public/images/projects

          if git diff --cached --quiet; then
            echo "No project changes."
            exit 0
          fi

          git commit -m "chore: sync github projects"
          git push
